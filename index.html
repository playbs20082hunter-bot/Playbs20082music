<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSIC • Скачай и слушай</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    :root { --neon-pink: #ff00cc; }
    body { font-family: 'Inter', sans-serif; }
    
    .music-text {
      font-size: 9rem;
      font-weight: 900;
      letter-spacing: -8px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 40px rgba(255, 0, 204, 0.6);
    }
    
    .hero-bg {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('https://picsum.photos/id/1015/1920/1080') center/cover;
      filter: brightness(0.35) saturate(1.2);
      z-index: 1;
    }
    
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 70%);
      z-index: 2;
    }
    
    .music-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .music-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgb(255 0 204 / 0.25); }
    
    .play-btn {
      transition: all 0.2s;
      animation: pulse 2s infinite;
    }
    .play-btn.playing { animation: pulse 2s infinite; }
    
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body class="bg-black text-white overflow-x-hidden">
  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-lg border-b border-white/10">
    <div class="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="music-text text-5xl tracking-tighter">MUSIC</span>
      </div>
      <div class="flex items-center gap-8 text-sm font-medium">
        <a href="#" class="hover:text-pink-400 transition-colors">Новые треки</a>
        <a href="#" class="hover:text-pink-400 transition-colors">Популярное</a>
        <a href="#" class="hover:text-pink-400 transition-colors">Топ 100</a>
        <a href="#" class="hover:text-pink-400 transition-colors">Жанры</a>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-bg flex items-center justify-center relative z-10">
    <div class="overlay"></div>
    <div class="relative z-20 max-w-4xl mx-auto text-center px-6">
      <h1 class="text-7xl md:text-8xl font-black tracking-tighter mb-4">
        СЛУШАЙ <span class="text-pink-400">МУЗЫКУ</span>
      </h1>
      <p class="text-xl md:text-2xl text-white/70 mb-12">Скачивай, слушай и наслаждайся везде</p>
      
      <div class="max-w-xl mx-auto">
        <div class="relative">
          <input id="search-input" type="text" placeholder="Название песни или исполнителя..." 
                 class="w-full bg-white/10 border border-white/20 rounded-3xl px-8 py-6 text-xl placeholder:text-white/40 focus:outline-none focus:border-pink-400 transition-colors">
          <button onclick="searchMusic()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-pink-500 hover:bg-pink-600 px-8 py-3 rounded-3xl font-semibold transition-colors">
            Найти
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results-section" class="max-w-7xl mx-auto px-8 py-20 hidden">
    <div class="flex items-center justify-between mb-10">
      <h2 class="text-4xl font-bold" id="results-title">Результаты поиска</h2>
      <button onclick="clearSearch()" class="px-6 py-3 border border-white/20 hover:border-white/40 rounded-3xl text-sm transition-colors">Очистить</button>
    </div>
    <div id="music-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-black border-t border-white/10 py-12">
    <div class="max-w-7xl mx-auto px-8 text-center text-white/40 text-sm">
      © 2026 MUSIC • Всё для твоего удовольствия
    </div>
  </footer>

  <script>
    // === ТВОИ ПЕСНИ (замени на свои) ===
    const musicLibrary = [
      {
        id: 1,
        title: "worry",
        artist: "LONOWN, riserayss",
        cover: "https://picsum.photos/id/1015/400/400",
        audio: "https://www.youtube.com/watch?v=lCKU-tI-upI"
      },
      {
        id: 2,
        title: "LEGACY",
        artist: "PIXY",
        cover: "https://picsum.photos/id/201/400/400",
        audio: "https://www.youtube.com/watch?v=Ps_6IcvAEm8"
      },
      {
        id: 3,
        title: "type london",
        artist: "ONDA ANDAR",
        cover: "https://picsum.photos/id/29/400/400",
        audio: "https://www.youtube.com/watch?v=_2tkmczXPpU"
      },
      {
        id: 4,
        title: "onda andar",
        artist: "ONDA ANDAR",
        cover: "https://picsum.photos/id/160/400/400",
        audio: "https://www.youtube.com/watch?v=SUCefsDmjk0"
      }
    ];

    let currentAudio = null;
    let currentPlayingId = null;

    function renderCards(filteredTracks) {
      const grid = document.getElementById('music-grid');
      grid.innerHTML = '';
      
      filteredTracks.forEach(track => {
        const card = document.createElement('div');
        card.className = `music-card bg-white/5 border border-white/10 rounded-3xl overflow-hidden`;
        card.innerHTML = `
          <div class="relative">
            <img src="${track.cover}" class="w-full aspect-square object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
            <button onclick="togglePlay(${track.id})" 
                    id="play-btn-${track.id}"
                    class="play-btn absolute bottom-6 left-6 w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-2xl hover:scale-110 transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24">
                <path d="M5 3l14 9-14 9V3z"/>
              </svg>
            </button>
          </div>
          <div class="p-6">
            <h3 class="font-semibold text-xl">${track.title}</h3>
            <p class="text-white/50">${track.artist}</p>
            
            <div class="mt-6 flex gap-3">
              <button onclick="togglePlay(${track.id})" 
                      class="flex-1 bg-white text-black font-semibold py-4 rounded-2xl hover:bg-pink-400 hover:text-white transition-all">
                Пустить
              </button>
              <button onclick="downloadTrack(${track.id})" 
                      class="flex-1 border border-white/30 hover:border-white/60 font-semibold py-4 rounded-2xl transition-all">
                Скачать
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function togglePlay(id) {
      const track = musicLibrary.find(t => t.id === id);
      if (!track) return;

      const playBtn = document.getElementById(`play-btn-${id}`);
      
      if (currentAudio && currentPlayingId === id) {
        currentAudio.pause();
        playBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>`;
        playBtn.classList.remove('playing');
        currentAudio = null;
        currentPlayingId = null;
        return;
      }

      if (currentAudio) currentAudio.pause();
      
      currentAudio = new Audio(track.audio);
      currentAudio.play();
      
      playBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>`;
      playBtn.classList.add('playing');
      
      currentPlayingId = id;
    }

    function downloadTrack(id) {
      const track = musicLibrary.find(t => t.id === id);
      if (!track) return;

      const a = document.createElement('a');
      a.href = track.audio;
      a.download = `${track.title.replace(/[^a-z0-9]/gi, '_')}.mp3`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      createConfetti();
    }

    function createConfetti() {
      const colors = ['#ff00cc', '#00ffff', '#ffff00'];
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.textContent = ['🎵', '💎', '✨'][Math.floor(Math.random() * 3)];
        confetti.style.position = 'fixed';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-50px';
        confetti.style.fontSize = Math.random() * 30 + 20 + 'px';
        confetti.style.zIndex = '9999';
        confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(confetti);

        const duration = Math.random() * 3 + 2;
        confetti.animate([
          { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
          { transform: `translateY(${window.innerHeight + 100}px) rotate(720deg)`, opacity: 0 }
        ], {
          duration: duration * 1000,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });
        setTimeout(() => confetti.remove(), duration * 1000);
      }
    }

    function searchMusic() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (!query) { document.getElementById('results-section').classList.add('hidden'); return; }

      const results = musicLibrary.filter(t => 
        t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query)
      );

      document.getElementById('results-section').classList.remove('hidden');
      document.getElementById('results-title').textContent = results.length ? `Найдено ${results.length} треков` : 'Ничего не найдено';
      renderCards(results);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('results-section').classList.add('hidden');
    }

    // Авто-продолжение после перезагрузки
    window.onload = () => {
      const savedId = localStorage.getItem('lastPlayingId');
      if (savedId) {
        currentPlayingId = parseInt(savedId);
        const track = musicLibrary.find(t => t.id === currentPlayingId);
        if (track) {
          currentAudio = new Audio(track.audio);
          currentAudio.play().then(() => {
            const btn = document.getElementById(`play-btn-${currentPlayingId}`);
            if (btn) btn.classList.add('playing');
          });
        }
      }
    };

    document.getElementById('search-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') searchMusic();
    });
  </script>
</body>
</html>
